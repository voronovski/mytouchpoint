<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="My Touchpoint in ten slides: why a calendar is only the beginning, how the app helps people connect, and opportunities for partners. English and Russian.">
  <title>Pitch Kit · My Touchpoint</title>
  <link rel="stylesheet" href="slides.css">
  <script src="content.js" defer></script>
  <script src="pitch-kit.js" defer></script>
</head>
<body>
  <a class="skip" href="#presentation" data-i18n="skip">Skip to presentation</a>
  <header class="site-header wrap">
    <div class="masthead">
      <div class="brand"><span class="mark" aria-hidden="true"></span>My Touchpoint <span class="kit-label">Pitch Kit</span></div>
      <div class="languages" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <div class="options">
      <fieldset><legend class="sr-only" data-i18n="format">Format</legend><div class="segmented">
        <button type="button" data-mode="deck" aria-pressed="true" data-i18n="deck">Slides</button>
        <button type="button" data-mode="text" aria-pressed="false" data-i18n="text">Full text</button>
      </div></fieldset>
      <div class="tools">
        <button class="tool" type="button" id="copy" data-i18n="copy">Copy text</button>
        <button class="tool" type="button" id="print" data-i18n="print">Print / PDF</button>
        <button class="tool present" type="button" id="fullscreen" data-i18n="fullscreen">Full screen</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="presentation" class="presentation" tabindex="-1" aria-label="My Touchpoint presentation">
      <div id="slide-stage" class="slide-stage"></div>
      <div class="deck-toolbar">
        <button type="button" id="previous" class="arrow" aria-label="Previous slide">←</button>
        <div class="deck-progress">
          <div id="slide-dots" class="slide-dots" role="group" aria-label="Choose a slide"></div>
          <span id="slide-status" class="slide-status" role="status" aria-live="polite" aria-atomic="true">Slide 1 of 10</span>
        </div>
        <button type="button" id="next" class="arrow" aria-label="Next slide">→</button>
        <button type="button" id="exit-fullscreen" class="tool" data-i18n="exitFullscreen" hidden>Exit full screen</button>
      </div>
    </div>
    <div class="deck-extras" id="deck-extras">
      <details id="speaker-notes"><summary data-i18n="notes">Speaker notes</summary><div id="speaker-copy"></div></details>
      <span class="keyboard-hint" data-i18n="keyboard">Use ← → to move between slides</span>
    </div>
    <article id="full-text" class="full-text" hidden></article>
    <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
    <div id="copy-fallback" class="copy-fallback" hidden>
      <label for="copy-text" data-i18n="copyHelp">Select and copy the text below.</label>
      <textarea id="copy-text" readonly></textarea>
    </div>
    <noscript><p>Please enable JavaScript to view the slides or contact <a href="mailto:o.chetrari@gmail.com">o.chetrari@gmail.com</a>.</p></noscript>
  </main>
  <footer class="wrap footer">
    <span>© 2026 My Touchpoint</span>
    <div class="footer-links"><a href="../privacy/" data-i18n="privacy">Privacy Policy</a><a href="../support/" data-i18n="support">Support</a><a href="https://claude.ai/artifact/YHUFAPVqRrQTes1m1aafdy" data-i18n="source">Source material</a></div>
  </footer>
</body>
</html>
